name: Release

# Push a tag like v1.2.3 to publish version 1.2.3 to nuget.org and create a GitHub release.
# Requires the repository secret NUGET_API_KEY.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build bexio-api/bexio-api.sln --configuration Release -p:Version=$VERSION

      - name: Test
        run: dotnet test bexio-api/bexio-api.sln --configuration Release --no-build

      - name: Pack
        run: dotnet pack bexio-api/bexio-lib/bexio-lib.csproj --configuration Release --no-build -p:Version=$VERSION --output ./nupkg

      - name: Push to nuget.org
        run: dotnet nuget push "nupkg/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: nupkg/*.nupkg
          generate_release_notes: true
